name: study-modular-sharding

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: demo_application
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d demo_application"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    platform: linux/amd64
    image: "${APPLICATION_IMAGE:?APPLICATION_IMAGE is required}"
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}"
      APP_ENV: "${APP_ENV:-production}"
      APP_REVISION: "${APPLICATION_REVISION:?APPLICATION_REVISION is required}"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/demo_application
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:?POSTGRES_USER is required}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      HISTORY_DB_MODE: "${HISTORY_DB_MODE:?HISTORY_DB_MODE is required}"
      HISTORY_DB_EXPECTED_MODE: "${HISTORY_DB_EXPECTED_MODE:?HISTORY_DB_EXPECTED_MODE is required}"
      HISTORY_SHARD_0_URL: jdbc:postgresql://postgres:5432/demo_shard_1
      HISTORY_SHARD_0_USERNAME: "${POSTGRES_USER:?POSTGRES_USER is required}"
      HISTORY_SHARD_0_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      HISTORY_SHARD_1_URL: jdbc:postgresql://postgres:5432/demo_shard_2
      HISTORY_SHARD_1_USERNAME: "${POSTGRES_USER:?POSTGRES_USER is required}"
      HISTORY_SHARD_1_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      SHARDING_MODE: "${SHARDING_MODE:-template}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/readyz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
